{% comment %}FR-25: the expiry an approval sets, filled in with the default and tagged Club default until
changed (the tag's script is in app.js).{% endcomment %}
<div class="field">
  <label for="{{ prefix }}{{ pk }}">Access expires <span class="tag" data-default-tag-for="{{ prefix }}{{ pk }}">Club default</span></label>
  <input type="date" id="{{ prefix }}{{ pk }}" name="expires_on" value="{{ expires|date:'Y-m-d' }}" data-default="{{ expires|date:'Y-m-d' }}" required>
</div>
