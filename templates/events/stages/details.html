{% extends "events/stages/_layout.html" %}
{% load nav %}
{% block stage %}
<section class="panel" aria-labelledby="det">
  <header class="panel-head"><div><h2 id="det">Details</h2></div>
    <div class="actions"><a class="button secondary" href="{% url 'event_edit' event.pk %}">{% icon 'edit' %}Edit details</a></div></header>
  <div class="panel-body"><dl class="dl">{% for label, value in details %}<dt>{{ label }}</dt><dd>{{ value }}</dd>{% endfor %}</dl></div>
</section>
{% endblock %}
