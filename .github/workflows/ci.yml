name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Club-neutral code (TR-40)
        run: bash tools/check_club_neutral.sh
      - name: No requirement identifiers in the interface
        run: bash tools/check_no_requirement_ids.sh
      - name: Interface house rules (docs/INTERFACE.md)
        run: bash tools/check_interface.sh
      - name: Tests
        run: pytest -n auto
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt || true
  accessibility:
    # FR-117, TR-36: axe-core over every page of the seeded demo, at desktop and phone width
    # (FR-95). A serious or critical violation fails the build, and a red build is never deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Accessibility (axe-core) and phone-width check
        # One worker per role: each is mostly waiting on a browser, not computing.
        run: pytest tools/a11y -o addopts="" -p no:cacheprovider -q -n auto
