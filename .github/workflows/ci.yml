name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Stylesheet and script format (Prettier, as tools/check.sh runs it)
        run: npx --yes prettier@3.6.2 --check static/css static/js static/sw.js
      - name: Club-neutral code (TR-40)
        run: bash tools/check_club_neutral.sh
      - name: No requirement identifiers in the interface
        run: bash tools/check_no_requirement_ids.sh
      - name: Interface house rules (docs/INTERFACE.md)
        run: bash tools/check_interface.sh
      - name: The club's own words for a dependency's strings (TR-45), as tools/check.sh and the deploy build them
        run: python manage.py compile_locale --settings=config.settings.test
      - name: Tests
        run: pytest -n auto
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt  # fails the build on a known advisory (TR-24, TR-38; 2026-11-12)
  accessibility:
    # FR-117, TR-36: axe-core over every page of the seeded demo, at desktop and phone width
    # (FR-95). A serious or critical violation fails the build, and a red build is never deployed.
    # One job per browser, side by side; one failing does not stop the others (SK, 2026-11-23).
    # The Chromium job also runs the tests that use no browser fixture (the contact sheet).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            only: "not firefox and not webkit"
          - browser: firefox
            only: firefox
          - browser: webkit
            only: webkit
    name: accessibility (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: The club's own words for a dependency's strings (TR-45), so the pages read as deployed
        run: python manage.py compile_locale --settings=config.settings.test
      - name: Accessibility (axe-core) and phone-width check
        # One worker per role: each is mostly waiting on a browser, not computing.
        run: pytest tools/a11y -o addopts="" -p no:cacheprovider -q -n auto -k "${{ matrix.only }}"
