# Club configuration: generic example values.
#
# Copy to club.yaml and edit, or supply an overlay directory with the same keys (see
# config/README.md). Every key here is read by `manage.py club_import`; a missing key takes
# the value shown. Values a sysadmin later changes in the interface win over this file unless
# the import is run with --reset.
#
# No secrets in this file. It is committed and public.

club:
  name: "Example Amateur Radio Club"
  short_name: "Example ARC"
  callsign: "N0CALL"
  university: null                            # or the institution's name
  department: null
  public_page: "https://example.org/"
  contact_email: "club@example.org"           # general contact; Reply-To fallback (FR-69)
  sending_address: "ops@example.org"          # From: on all system mail (FR-69)
  sending_display_name: "Example ARC Operations"
  timezone: "UTC"                             # default event display zone (FR-36)
  station_location_name: "Club station"

branding:
  logo: "assets/club-logo.svg"
  logo_monochrome: "assets/club-logo.svg"
  favicon: "assets/club-logo.svg"
  apple_touch_icon: "assets/club-logo.svg"
  qsl_card: null
  # The club's colour: footer, sign-in panel, buttons, links, and the active menu entry. A
  # six-digit hex; it must carry white text at WCAG AA (4.5:1) or the application's own
  # colour is used instead (FR-116). null keeps the default.
  accent: null

member_categories:                            # FR-8, FR-12; edit freely
  - { key: student,   label: "Student" }
  - { key: faculty,   label: "Faculty" }
  - { key: staff,     label: "Staff" }
  - { key: community, label: "Community Member" }

club_positions:                               # the position is displayed; capabilities follow
  - { key: advisor,        label: "Advisor" }       # the access level, not the position
  - { key: trustee,        label: "License Trustee" }
  - { key: president,      label: "President" }
  - { key: vice_president, label: "Vice President" }
  - { key: secretary,      label: "Secretary" }
  - { key: treasurer,      label: "Treasurer" }

license_ladder: ["Novice", "Technician", "General", "Advanced", "Extra"]   # FR-19; US default

slot_roles:                                   # FR-49, FR-50, FR-122
  # requires_license: the role needs a valid amateur license (any class; the event's preferred
  # class only warns, FR-61). Station and IT access are slot requirements, never a role's.
  - { key: operator, label: "Operator", on_air: true }
  - { key: mentor,   label: "Mentor",   on_air: true, requires_license: true }
  - { key: observer, label: "Observer", on_air: false }

# Entry links (FR-119): a class link may require an address at one of these domains, and an
# account that arrives through one is admitted at once. Empty means class links cannot be made.
trusted_email_domains: []

non_operating_slot_kinds:                     # FR-47
  - { key: setup,     label: "Setup",               viability: [station_access] }
  - { key: breakdown, label: "Breakdown",           viability: [station_access] }
  - { key: training,  label: "Training",            viability: [station_access] }
  - { key: precheck,  label: "Equipment pre-check", viability: [station_access] }
  - { key: debrief,   label: "Post-event analysis", viability: [] }

credential_types:                             # FR-18; add your own
  - key: amateur_license
    label: "Amateur radio license"
    established_by: fcc_uls
    graded: true
  - key: station_access
    label: "Station access"
    established_by: agreement
    default_expiry: one_year                  # or next_september_1_skip_august (FR-25)
  - key: it_access
    label: "Computer access"
    established_by: agreement
    default_expiry: one_year

viability_rule_default:                       # FR-61
  require_all_of:
    - { credential: amateur_license, min_class_from_event: true }
    - { credential: station_access }

agreements:                                   # FR-21; example templates, replace before use
  - key: station_access.example
    credential: station_access
    audience: [student, faculty, staff, community]
    file: "agreements/station-access.example.html"
    title: "Station Access Agreement (example)"
  - key: it_access.example
    credential: it_access
    audience: [student, faculty, staff, community]
    file: "agreements/it-access.example.html"
    title: "Computer Use Agreement (example)"

defaults:
  slot_length_minutes: 60                     # FR-46
  cancellation_cutoff_hours: 24               # FR-56
  reminder_hours_before: 24                   # FR-72
  at_risk_horizon_hours: 72                   # FR-73
  checkin_opens_minutes_before: 30            # FR-113
  late_arrival_notice_minutes: 15             # FR-113
  invitation_expiry_days: 14                  # FR-3
  temporary_password_expiry_hours: 72         # FR-7
  agreement_expiry_notice_days: 30            # FR-28
  email_delivery: "off"                       # FR-105; turn on when your mail path works
  entry_link_verification_days: 7              # FR-120; an officer can waive it per account or per link
  waitlist_offer_hours: 12                     # FR-57; how long a waitlisted member has to take an offered place
  health_overview_weeks: 6                     # FR-68; the Upcoming health page's horizon
  # FR-77: the headings a new event's Know-before-you-go starts with (editor HTML). Optional.
  # kbyg_outline_html: "<h2>Where and when</h2><p></p><h2>What to bring</h2><p></p>"
  # Retention, applied daily by retention:apply. Days. A member's own record is not on this
  # list: former members are archived and kept, not deleted.
  retention_responsible_adult_days: 365        # adults named for a minor's slot, after the event
  retention_message_days: 365                  # message bodies (the fact and count stay)
  retention_invitation_days: 90                # invitations never completed, after expiry

# FR-101: the privacy notice, shown at /privacy/ and linked from every page. Replace with the
# club's own approved text (HTML from the editor's allowed set). The advisor approves it.
privacy_notice_html: |
  <h1>Privacy notice</h1>
  <p>This site helps the club schedule operating events and manage access to its station. It holds the details you give when you join (name, callsign, email addresses, phone, membership category, and for students your level and expected graduation) and what you do here (sign-ups, check-ins, signed access agreements, and the messages sent to you).</p>
  <h2>Who sees what</h2>
  <p>Other members see your first name, callsign, and licence class on rosters and in the directory. Event captains, club officers, and the people who run this site see your full name and contact details. Nothing here is visible without signing in.</p>
  <h2>How long it is kept</h2>
  <p>When you leave, your record is archived rather than deleted: your name, callsign, contact details, and what you took part in are kept as the club's record of its members, and only the faculty advisor and the people who administer this site can read the archive. Some things are still removed on a schedule: the adults named to accompany a member under 18 are kept a year after the event, message bodies are kept a year, and invitations nobody used are removed three months after they expire. The record of who did what on this site is kept indefinitely.</p>
  <h2>Closing your account</h2>
  <p>Ask from your profile page, or ask a club officer. Access ends at once and your record is archived. If you want it deleted outright rather than archived, say so: an administrator can do that, and what survives is only what the club needs to keep its own past rosters and counts correct.</p>
